services:
  miniflux:
    image: miniflux/miniflux:latest
    container_name: ${PROJECT_NAME}-app
    ports:
      - ${HOST_PORT}:8080
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ADMIN_USERNAME
      - ADMIN_PASSWORD
      - BASE_URL
      - CLEANUP_ARCHIVE_BATCH_SIZE
      - CLEANUP_ARCHIVE_READ_DAYS
      - CLEANUP_ARCHIVE_UNREAD_DAYS
      - CREATE_ADMIN
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db/${POSTGRES_DB}?sslmode=disable
      - FETCH_YOUTUBE_WATCH_TIME
      - HTTP_CLIENT_USER_AGENT
      - OAUTH2_PROVIDER
      - OAUTH2_CLIENT_ID
      - OAUTH2_CLIENT_SECRET
      - OAUTH2_REDIRECT_URL
      - OAUTH2_USER_CREATION
      - POLLING_FREQUENCY
      - POLLING_LIMIT_PER_HOST
      - POLLING_PARSING_ERROR_LIMIT
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - RUN_MIGRATIONS
      - WEBAUTHN
      - WORKER_POOL_SIZE
      - YOUTUBE_API_KEY

    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

    restart: unless-stopped

    networks:
      - homelab_net

    healthcheck:
      test: ["CMD", "/usr/bin/miniflux", "-healthcheck", "auto"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:18-alpine
    container_name: ${PROJECT_NAME}-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}

    volumes:
      - ~/docker-volumes/miniflux-db:/var/lib/postgresql
#      - miniflux-db:/var/lib/postgresql
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro

    restart: unless-stopped

    networks:
      - homelab_net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      start_period: 30s
      retries: 5

#volumes:
#  miniflux-db:

networks:
  homelab_net:
    external: true
