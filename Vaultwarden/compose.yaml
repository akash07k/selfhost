services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: ${PROJECT_NAME}

    restart: unless-stopped

    environment:
      - ADMIN_TOKEN
      - DOMAIN
      - EMAIL_2FA_ENFORCE_ON_VERIFIED_INVITE
      - EMAIL_2FA_AUTO_FALLBACK
      - LOG_FILE
      - PASSWORD_HINTS_ALLOWED
      - PUSH_ENABLED
      - PUSH_INSTALLATION_ID
      - PUSH_INSTALLATION_KEY
      - REQUIRE_DEVICE_EMAIL
      - SIGNUPS_ALLOWED
      - SIGNUPS_VERIFY
      - SIGNUPS_VERIFY_RESEND_TIME
      - SIGNUPS_VERIFY_RESEND_LIMIT
      - SMTP_FROM
      - SMTP_HOST
      - SMTP_USERNAME
      - SMTP_PASSWORD
      - SMTP_PORT
      - SMTP_SECURITY
      - YUBICO_CLIENT_ID
      - YUBICO_SECRET_KEY

    volumes:
      - ~/docker-volumes/vw-data:/data # the path before the : can be changed
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

    ports:
      - ${HOST_PORT}:80

    networks:
      - homelab_net

networks:
  homelab_net:
    external: true
